services:
  - type: web
    name: agente-crovn
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS=false --server.enableXsrfProtection=false
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: API_BASE_URL
        value: https://crovn-backend.vercel.app